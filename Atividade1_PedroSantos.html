<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade CSS</title>
    <style>
        body {
            background-color: lightblue;
        }

        h1 {
            color: white;
            text-align: center;
        }

        p {
            font-family: verdana, geneva, tahoma, sans-serif;
            font-size: 20px;
        }

        #para1 {
            background-color: purple;
            width: 120px;
            height: 120px;
            border: 1px solid yellow;
            /* margin é margem de fora */
            margin: 20px;
            /* padding é o espaço dentro da borda */
            padding-top: 20px;
            color: yellow;
            font-size: 20px;


        }

        .centralizado {
            text-align: center;
            color: green;

        }
    </style>
</head>

<body>
    <h1>Meu primeiro CSS de exemplo</h1>
    <p>Este é um parágrafo de exemplo para demonstrar o uso de CSS em uma página HTML. O fundo da página é azul claro, o
        título está centralizado e em branco, e este texto está em uma fonte legível.</p>
    <div id="para1">Texto 01</div>
    <div class="centralizado">Texto 02</div>

</body>

</html>
